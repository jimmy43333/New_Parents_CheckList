<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新手爸媽準備清單</title>
<style>
  :root {
    --bg: #F5DDC7;
    --surface: #FFF7EC;
    --surface-alt: #FCEEDD;
    --ink: #3E2C22;
    --ink-soft: #8C7160;
    --ink-faint: #B7A090;
    --border: rgba(62,44,34,0.10);
    --border-strong: rgba(62,44,34,0.18);
    --accent-coral: #E1734F;
    --accent-coral-soft: #FBDECF;
    --accent-sage: #6B9270;
    --accent-sage-soft: #E1EDDF;
    --accent-honey: #DE9C2F;
    --accent-honey-soft: #FBEAC9;
    --accent-lavender: #8A7FB0;
    --accent-lavender-soft: #EAE6F4;
    --neutral-soft: #F2E2D6;
    --neutral-ink: #8C7160;
    --phase-mauve: #A98FC7;
    --phase-mauve-soft: #EFE5F5;
    --phase-dustyrose: #E0A3A0;
    --phase-dustyrose-soft: #FBE9E7;
    --phase-clay: #D9986F;
    --phase-clay-soft: #F8E5D3;
    --phase-slate: #7FAFC2;
    --phase-slate-soft: #E1F0F5;
    --phase-taupe: #C7B48F;
    --phase-taupe-soft: #F5EDDC;
    --shadow: 0 1px 2px rgba(62,44,34,0.06), 0 8px 20px -12px rgba(62,44,34,0.18);
  }

  :root[data-theme="dark"] {
    --bg: #1C201B;
    --surface: #262B24;
    --surface-alt: #2C3129;
    --ink: #EEEBE0;
    --ink-soft: #ABA994;
    --ink-faint: #7C7A66;
    --border: rgba(238,235,224,0.10);
    --border-strong: rgba(238,235,224,0.18);
    --accent-coral: #F0916D;
    --accent-coral-soft: #4A342A;
    --accent-sage: #93C296;
    --accent-sage-soft: #33402F;
    --accent-honey: #F0BE5D;
    --accent-honey-soft: #453A22;
    --accent-lavender: #B6ACDA;
    --accent-lavender-soft: #363150;
    --neutral-soft: #33352C;
    --neutral-ink: #ABA994;
    --phase-mauve: #CBA8E0;
    --phase-mauve-soft: #453655;
    --phase-dustyrose: #F0B7B0;
    --phase-dustyrose-soft: #4A302E;
    --phase-clay: #EAB68A;
    --phase-clay-soft: #46331F;
    --phase-slate: #96CBE0;
    --phase-slate-soft: #223C46;
    --phase-taupe: #DCC79A;
    --phase-taupe-soft: #3E351F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221712;
      --surface: #2C1F19;
      --surface-alt: #34261F;
      --ink: #F4E8DE;
      --ink-soft: #C6AC9A;
      --ink-faint: #8F7768;
      --border: rgba(244,232,222,0.10);
      --border-strong: rgba(244,232,222,0.18);
      --accent-coral: #F0916D;
      --accent-coral-soft: #4A342A;
      --accent-sage: #93C296;
      --accent-sage-soft: #33402F;
      --accent-honey: #F0BE5D;
      --accent-honey-soft: #453A22;
      --accent-lavender: #B6ACDA;
      --accent-lavender-soft: #363150;
      --neutral-soft: #3B2B22;
      --neutral-ink: #C6AC9A;
      --phase-mauve: #CBA8E0;
      --phase-mauve-soft: #453655;
      --phase-dustyrose: #F0B7B0;
      --phase-dustyrose-soft: #4A302E;
      --phase-clay: #EAB68A;
      --phase-clay-soft: #46331F;
      --phase-slate: #96CBE0;
      --phase-slate-soft: #223C46;
      --phase-taupe: #DCC79A;
      --phase-taupe-soft: #3E351F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang TC", "Hiragino Sans TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ---------- Header ---------- */
  .hero {
    padding: 44px 4px 20px;
  }
  h1 {
    font-size: clamp(1.7rem, 4vw, 2.35rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  .hero-sub {
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 62ch;
    margin: 0;
  }
  .hero-updated {
    font-size: 0.76rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    margin: 10px 0 0;
  }

  /* ---------- Tabs ---------- */
  .tabbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 6px;
    padding: 12px 4px;
    margin-top: 8px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 10px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab-btn .tab-icon { font-size: 1.05rem; line-height: 1; }
  .tab-btn:hover { background: var(--surface-alt); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 2px; }
  .tab-btn[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--border-strong);
    box-shadow: var(--shadow);
  }
  .tab-count {
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .tab-btn[aria-selected="true"] .tab-count { color: var(--accent-coral); }

  /* ---------- Progress ---------- */
  .progress-block {
    padding: 22px 4px 6px;
  }
  .progress-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 9px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .progress-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .progress-stat {
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--ink-faint);
  }
  .progress-stat strong { color: var(--accent-sage); font-size: 0.95rem; }
  .progress-track {
    height: 9px;
    border-radius: 999px;
    background: var(--neutral-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-honey), var(--accent-sage));
    transition: width 0.35s cubic-bezier(.4,0,.2,1);
  }
  .reset-btn {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .reset-btn:hover { color: var(--accent-coral); border-color: var(--accent-coral); }

  /* ---------- Budget ---------- */
  .budget-block {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 4px 0;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--accent-honey-soft);
    border: 1px solid var(--border);
  }
  .budget-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .budget-value {
    font-variant-numeric: tabular-nums;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent-honey);
  }
  .budget-hint {
    flex-basis: 100%;
    font-size: 0.74rem;
    color: var(--ink-faint);
  }

  .cost-input-wrap { position: relative; }
  .cost-prefix {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .cost-input {
    width: 100%;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 8px 8px 8px 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--ink);
  }
  .cost-input::placeholder { color: var(--ink-faint); font-weight: 500; }
  .cost-input:hover { border-color: var(--border-strong); }
  .cost-input:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 1px; }

  /* ---------- Phase filter chips ---------- */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 4px 4px;
  }
  .chip {
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--border-strong); }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  /* ---------- Groups & Cards ---------- */
  .group { padding: 26px 4px 6px; }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .group-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin: 0;
  }
  .group-phase-badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-lavender-soft);
    color: var(--accent-lavender);
    white-space: nowrap;
  }
  .group-count {
    font-size: 0.78rem;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .card-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: minmax(130px, 220px) 1fr 150px;
    align-items: center;
    gap: 16px;
    transition: border-color 0.15s ease;
  }
  .card.has-phase {
    grid-template-columns: minmax(120px, 200px) 116px 1fr 150px;
  }
  .card.has-phase.has-cost {
    grid-template-columns: minmax(120px, 190px) 116px 1fr 120px 150px;
  }
  .card[data-state="done"] {
    border-color: color-mix(in srgb, var(--accent-sage) 45%, var(--border));
    background: color-mix(in srgb, var(--accent-sage-soft) 45%, var(--surface));
  }
  .card-name {
    font-size: 0.95rem;
    font-weight: 700;
    line-height: 1.4;
    margin: 0;
  }
  .card[data-state="done"] .card-name { color: var(--accent-sage); }
  .card-link {
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card-link:hover, .card-link:focus-visible {
    border-color: var(--accent-coral);
    background: color-mix(in srgb, var(--accent-coral-soft) 40%, var(--surface));
  }
  .card-link:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 2px; }
  .card-link .card-note { margin: 0; }
  .card-link-arrow {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent-coral);
    text-align: right;
    white-space: nowrap;
  }
  .card-name-btn {
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
    cursor: pointer;
    text-decoration-line: underline;
    text-decoration-color: transparent;
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease, color 0.15s ease;
  }
  .card-name-btn:hover { text-decoration-color: currentColor; color: var(--accent-coral); }
  .card-name-btn:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 2px; border-radius: 3px; }
  .phase-chip {
    grid-area: phase;
    justify-self: start;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--neutral-soft);
    color: var(--neutral-ink);
  }
  .phase-chip[data-phase="pregnancy-early"] { background: var(--phase-mauve-soft); color: var(--phase-mauve); }
  .phase-chip[data-phase="pregnancy-late"] { background: var(--phase-dustyrose-soft); color: var(--phase-dustyrose); }
  .phase-chip[data-phase="during-birth"] { background: var(--phase-clay-soft); color: var(--phase-clay); }
  .phase-chip[data-phase="before-home"] { background: var(--phase-slate-soft); color: var(--phase-slate); }
  .phase-chip[data-phase="after-full-month"] { background: var(--phase-taupe-soft); color: var(--phase-taupe); }

  .phase-select-wrap {
    position: relative;
    justify-self: start;
    width: 100%;
  }
  .phase-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 6px 20px 6px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--neutral-soft);
    color: var(--neutral-ink);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .phase-select:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 1px; }
  .select-arrow-sm {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 0.6rem;
    color: inherit;
  }
  .phase-select-wrap[data-phase="pregnancy-early"] .phase-select { background: var(--phase-mauve-soft); color: var(--phase-mauve); }
  .phase-select-wrap[data-phase="pregnancy-late"] .phase-select { background: var(--phase-dustyrose-soft); color: var(--phase-dustyrose); }
  .phase-select-wrap[data-phase="during-birth"] .phase-select { background: var(--phase-clay-soft); color: var(--phase-clay); }
  .phase-select-wrap[data-phase="before-home"] .phase-select { background: var(--phase-slate-soft); color: var(--phase-slate); }
  .phase-select-wrap[data-phase="after-full-month"] .phase-select { background: var(--phase-taupe-soft); color: var(--phase-taupe); }
  .phase-select-wrap[data-phase="unassessed"] .phase-select { background: var(--neutral-soft); color: var(--neutral-ink); }

  .card-note {
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0;
  }
  .card.has-cost .card-note {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }

  @media (max-width: 700px) {
    .card, .card.has-phase, .card.has-phase.has-cost {
      grid-template-columns: 1fr;
      align-items: start;
      gap: 8px;
    }
    .card.has-cost .card-note {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
  }

  /* ---------- Phone refinements ---------- */
  @media (max-width: 700px) {
    .page { padding: 0 14px 60px; }

    .hero { padding: 26px 2px 16px; }
    .hero-sub { font-size: 0.9rem; }

    .theme-toggle { top: 10px; right: 10px; width: 38px; height: 38px; font-size: 1rem; }

    /* tabs stacked top-to-bottom, each a full-width single-line row */
    .tabbar {
      flex-direction: column;
      gap: 6px;
      padding: 8px 2px;
    }
    .tab-btn {
      width: 100%;
      flex-direction: row;
      justify-content: flex-start;
      gap: 9px;
      padding: 11px 14px;
      font-size: 0.88rem;
    }
    .tab-btn .tab-icon { font-size: 1.1rem; }
    .tab-count { margin-left: auto; }

    .progress-block { padding: 18px 2px 4px; }
    .budget-block { margin: 14px 2px 0; padding: 12px 14px; }
    .budget-value { font-size: 1rem; }

    .filter-row { padding: 14px 2px 2px; }
    .chip { padding: 8px 13px; min-height: 38px; }
    .reset-btn { min-height: 36px; padding: 6px 11px; }

    .group { padding: 22px 2px 6px; }

    /* card: title + time tag on one row (time tag right-aligned), then budget/status, then note */
    .card {
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 1fr 118px;
      column-gap: 10px;
      row-gap: 7px;
      align-items: start;
      grid-template-areas:
        "name   status"
        "note   note";
    }
    .card.has-phase,
    .card.has-phase.has-cost {
      padding: 13px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 8px;
      row-gap: 7px;
      align-items: start;
    }
    .card.has-phase {
      grid-template-areas:
        "name   phase"
        "status status"
        "note   note";
    }
    .card.has-phase.has-cost {
      grid-template-areas:
        "name   phase"
        "cost   status"
        "note   note";
    }
    .card-name { grid-area: name; min-width: 0; }
    .status-select-wrap { grid-area: status; width: 100%; }
    .phase-select-wrap { grid-area: phase; width: 100%; }
    .cost-input-wrap { grid-area: cost; width: 100%; }
    .card-note { grid-area: note; }

    /* bigger touch targets for form controls */
    .status-select { padding: 10px 24px 10px 10px; min-height: 42px; font-size: 0.74rem; }
    .phase-select { padding: 9px 18px 9px 10px; font-size: 0.7rem; }
    .cost-input { padding: 10px 6px 10px 30px; min-height: 42px; font-size: 0.72rem; }
    .cost-prefix { left: 8px; font-size: 0.66rem; }

    /* cost/status row needs narrower controls to fit */
    .card.has-phase .status-select,
    .card.has-phase.has-cost .status-select {
      padding: 9px 20px 9px 8px;
      min-height: 40px;
      font-size: 0.68rem;
    }
    .card.has-phase .phase-select-wrap {
      width: auto;
      max-width: 100%;
      justify-self: end;
    }
    .card.has-phase .phase-chip { justify-self: end; }
    .card.has-phase .phase-select {
      width: auto;
      padding: 8px 22px 8px 12px;
      font-size: 0.64rem;
      text-align: center;
      text-align-last: center;
    }
    .card.has-phase.has-cost .cost-input {
      padding: 9px 4px 9px 24px;
      min-height: 40px;
      font-size: 0.66rem;
    }
    .card.has-phase.has-cost .cost-prefix { left: 5px; font-size: 0.6rem; }
    .card.has-phase .select-arrow,
    .card.has-phase.has-cost .select-arrow { right: 7px; font-size: 0.6rem; }
    .card.has-phase .select-arrow-sm,
    .card.has-phase.has-cost .select-arrow-sm { right: 6px; }

    .modal-title { font-size: 1.02rem; }
    .modal-panel { max-height: 92vh; }
  }

  .status-select-wrap {
    position: relative;
  }
  .status-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 8px 30px 8px 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .status-select:hover { border-color: var(--border-strong); }
  .status-select:focus-visible { outline: 2px solid var(--accent-coral); outline-offset: 1px; }
  .select-arrow {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 0.65rem;
    color: inherit;
  }
  .status-select-wrap[data-slot="0"] { color: var(--ink); }
  .status-select-wrap[data-slot="0"] .status-select { background: var(--neutral-soft); border-color: var(--border-strong); color: var(--ink); }
  .status-select-wrap[data-slot="1"] { color: var(--accent-honey); }
  .status-select-wrap[data-slot="1"] .status-select { background: var(--accent-honey-soft); border-color: var(--accent-honey); color: var(--accent-honey); }
  .status-select-wrap[data-slot="2"] { color: var(--accent-sage); }
  .status-select-wrap[data-slot="2"] .status-select { background: var(--accent-sage-soft); border-color: var(--accent-sage); color: var(--accent-sage); }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 50px;

  function setItemPhase(itemId, phaseKey) {
    phaseState[itemId] = phaseKey;
    savePhases();
  }

  function renderPhaseSelect(item, group) {
    var current = getItemPhase(item, group);

    var wrap = document.createElement("div");
    wrap.className = "phase-select-wrap";
    wrap.setAttribute("data-phase", current);

    var select = document.createElement("select");
    select.className = "phase-select";
    select.setAttribute("aria-label", item.name + " 的時間標籤");
    PHASE_SELECT_OPTIONS.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt.key;
      o.textContent = opt.label;
      if (opt.key === current) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener("change", function () {
      setItemPhase(item.id, select.value);
      renderPanel();
    });

    var arrow = document.createElement("span");
    arrow.className = "select-arrow-sm";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "▾";

    wrap.appendChild(select);
    wrap.appendChild(arrow);
    return wrap;
  }

  // ---------------- ITEM DETAIL MODAL ----------------

  var modalOverlay = document.getElementById("itemModalOverlay");
  var modalTitle = document.getElementById("itemModalTitle");
  var modalExperience = document.getElementById("itemModalExperience");
  var modalNotes = document.getElementById("itemModalNotes");
  var modalSaved = document.getElementById("itemModalSaved");
  var modalCloseBtn = document.getElementById("itemModalClose");
  var modalBrandBlock = document.getElementById("itemModalBrandBlock");
  var modalBrandToggle = document.getElementById("itemModalBrandToggle");
  var modalBrandPanel = document.getElementById("itemModalBrandPanel");
  var modalCurrentItemId = null;
  var modalSavedTimer = null;

  function buildExperienceHtml(item, info) {
    if (info && info.notionNote && info.notionNote.length) {
      return '<div class="modal-note-text">' + info.notionNote.map(escapeHtml).join("<br>") + "</div>";
    }
    return '<p class="modal-note-text">目前沒有相關經驗分享。</p>';
  }

  function buildBrandListHtml(info) {
    var top3 = info.brandSuggestions.slice(0, 3);
    var html = '<ul class="modal-brand-list">';
    top3.forEach(function (b) {
      var name = (typeof b === "object" && b) ? b.name : b;
      var url = (typeof b === "object" && b) ? b.url : null;
      if (url) {
        html += '<li><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(name) + " ↗</a></li>";
      } else {
        html += "<li>" + escapeHtml(name) + "</li>";
      }
    });
    html += "</ul>";
    html += '<p class="modal-disclaimer">以上為市面主流品牌參考(前三名),僅供搜尋方向參考,非採購建議或代言,實際請自行比價評估。</p>';
    return html;
  }

  function collapseBrandPanel() {
    modalBrandPanel.hidden = true;
    modalBrandToggle.setAttribute("aria-expanded", "false");
  }

  modalBrandToggle.addEventListener("click", function () {
    var expanded = modalBrandToggle.getAttribute("aria-expanded") === "true";
    modalBrandPanel.hidden = expanded;
    modalBrandToggle.setAttribute("aria-expanded", expanded ? "false" : "true");
  });

  function openItemModal(item) {
    modalCurrentItemId = item.id;
    modalTitle.textContent = item.name;

    var info = BRAND_INFO[item.id];
    modalExperience.innerHTML = buildExperienceHtml(item, info);

    if (info && info.brandSuggestions && info.brandSuggestions.length) {
      modalBrandBlock.hidden = false;
      modalBrandPanel.innerHTML = buildBrandListHtml(info);
    } else {
      modalBrandBlock.hidden = true;
      modalBrandPanel.innerHTML = "";
    }
    collapseBrandPanel();

    modalNotes.value = notesState[item.id] || "";
    modalSaved.textContent = "";
    modalOverlay.classList.add("open");
    document.documentElement.style.overflow = "hidden";
    window.setTimeout(function () { modalNotes.focus({ preventScroll: true }); }, 50);
  }

  function closeItemModal() {
    modalOverlay.classList.remove("open");
    document.documentElement.style.overflow = "";
    modalCurrentItemId = null;
  }

  modalCloseBtn.addEventListener("click", closeItemModal);
  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeItemModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeItemModal();
  });
  modalNotes.addEventListener("input", function () {
    if (!modalCurrentItemId) return;
    var val = modalNotes.value;
    if (val.trim() === "") {
      delete notesState[modalCurrentItemId];
    } else {
      notesState[modalCurrentItemId] = val;
    }
    saveNotes();
    modalSaved.textContent = "已自動儲存";
    if (modalSavedTimer) window.clearTimeout(modalSavedTimer);
    modalSavedTimer = window.setTimeout(function () { modalSaved.textContent = ""; }, 1500);
  });

  // ---------------- RENDER ----------------

  var tabbarEl = document.getElementById("tabbar");
  var panelsEl = document.getElementById("tabpanels");

  function render() {
    renderTabbar();
    renderPanel();
  }

  function renderTabbar() {
    tabbarEl.innerHTML = "";
    TAB_ORDER.forEach(function (key) {
      var tabDef = DATA[key];
      var items = allItems(tabDef);
      var doneCount = items.filter(function (it) {
        return getItemStatus(tabDef, it) === tabDef.doneKey;
      }).length;

      var btn = document.createElement("button");
      btn.className = "tab-btn";
      btn.type = "button";
      btn.role = "tab";
      btn.setAttribute("aria-selected", key === activeTab ? "true" : "false");
      btn.innerHTML =
        '<span class="tab-icon">' + tabDef.icon + '</span>' +
        '<span>' + tabDef.label + '</span>' +
        '<span class="tab-count">' + doneCount + '/' + items.length + '</span>';
      btn.addEventListener("click", function () {
        activeTab = key;
        render();
      });
      tabbarEl.appendChild(btn);
    });
  }

  function renderPanel() {
    panelsEl.innerHTML = "";
    var tabDef = DATA[activeTab];
    var items = allItems(tabDef);
    var doneCount = items.filter(function (it) {
      return getItemStatus(tabDef, it) === tabDef.doneKey;
    }).length;
    var pct = items.length ? Math.round((doneCount / items.length) * 100) : 0;

    var panel = document.createElement("section");
    panel.setAttribute("role", "tabpanel");

    // progress block
    var progressBlock = document.createElement("div");
    progressBlock.className = "progress-block";
    progressBlock.innerHTML =
      '<div class="progress-top">' +
        '<span class="progress-label">' + tabDef.label + ' 準備進度</span>' +
        '<span class="progress-stat"><strong>' + pct + '%</strong> · ' + doneCount + ' / ' + items.length + ' 項完成</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    panel.appendChild(progressBlock);

    // budget block
    if (tabDef.hasCost) {
      var budgetBlock = document.createElement("div");
      budgetBlock.className = "budget-block";
      budgetBlock.innerHTML =
        '<span class="budget-label">💰 已填寫花費總額</span>' +
        '<span class="budget-value" id="budgetTotalValue">' + formatNTD(computeCostTotal(tabDef)) + '</span>' +
        '<span class="budget-hint">每張卡片欄位裡的灰色數字是市場行情粗估價,僅供參考;實際花費請自行輸入,總額只會計算你有填寫的項目。</span>';
      panel.appendChild(budgetBlock);
    }

    // reset button row
    var actionsRow = document.createElement("div");
    actionsRow.style.cssText = "display:flex;justify-content:flex-end;padding:10px 4px 0;";
    var resetBtn = document.createElement("button");
    resetBtn.className = "reset-btn";
    resetBtn.type = "button";
    resetBtn.textContent = "重置本頁進度";
    resetBtn.addEventListener("click", function () {
      if (!confirm("確定要重置「" + tabDef.label + "」的所有進度嗎?")) return;
      items.forEach(function (it) { delete state[it.id]; });
      saveState();
      render();
    });
    actionsRow.appendChild(resetBtn);
    panel.appendChild(actionsRow);

    // filter chips
    if (tabDef.hasFilter) {
      var phasesPresent = [];
      items.forEach(function (it) {
        var ph = tabDef.phaseSelectable ? getItemPhase(it) : it.phase;
        if (ph && phasesPresent.indexOf(ph) === -1) phasesPresent.push(ph);
      });
      phasesPresent.sort(function (a, b) { return PHASE_SORT_ORDER.indexOf(a) - PHASE_SORT_ORDER.indexOf(b); });

      var filterRow = document.createElement("div");
      filterRow.className = "filter-row";

      var allChip = document.createElement("button");
      allChip.className = "chip";
      allChip.type = "button";
      allChip.textContent = "全部";
      allChip.setAttribute("aria-pressed", activeFilter[activeTab] === "all" ? "true" : "false");
      allChip.addEventListener("click", function () { activeFilter[activeTab] = "all"; render(); });
      filterRow.appendChild(allChip);

      phasesPresent.forEach(function (ph) {
        var chip = document.createElement("button");
        chip.className = "chip";
        chip.type = "button";
        chip.textContent = PHASE_LABEL[ph] || ph;
        chip.setAttribute("aria-pressed", activeFilter[activeTab] === ph ? "true" : "false");
        chip.addEventListener("click", function () { activeFilter[activeTab] = ph; render(); });
        filterRow.appendChild(chip);
      });

      panel.appendChild(filterRow);
    }

    // groups
    tabDef.groups.forEach(function (group) {
      var filter = activeFilter[activeTab];
      var visibleItems = group.items.filter(function (it) {
        if (filter === "all") return true;
        var ph = tabDef.phaseSelectable ? getItemPhase(it, group) : it.phase;
        return ph === filter;
      });
      if (!visibleItems.length) return;

      if (tabDef.phaseSelectable) {
        visibleItems = visibleItems.slice().sort(function (a, b) {
          var ka = PHASE_SORT_ORDER.indexOf(getItemPhase(a, group));
          var kb = PHASE_SORT_ORDER.indexOf(getItemPhase(b, group));
          if (ka === -1) ka = PHASE_SORT_ORDER.length;
          if (kb === -1) kb = PHASE_SORT_ORDER.length;
          if (ka !== kb) return ka - kb;
          var ma = typeof a.month === "number" ? a.month : Infinity;
          var mb = typeof b.month === "number" ? b.month : Infinity;
          return ma - mb;
        });
      }

      var groupEl = document.createElement("div");
      groupEl.className = "group";

      var head = document.createElement("div");
      head.className = "group-head";
      var headHtml = '<h2 class="group-title">' + group.name + '</h2>';
      if (group.phase) {
        headHtml += '<span class="group-phase-badge">' + PHASE_LABEL[group.phase] + '</span>';
      }
      headHtml += '<span class="group-count">' + visibleItems.length + ' 項</span>';
      head.innerHTML = headHtml;
      groupEl.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "card-grid";

      visibleItems.forEach(function (item) {
        grid.appendChild(renderCard(tabDef, item, group));
      });

      groupEl.appendChild(grid);
      panel.appendChild(groupEl);
    });

    panelsEl.appendChild(panel);
  }

  function computeLinkedTabStatusKey(tabDef, linkedTabDef) {
    var linkedItems = allItems(linkedTabDef);
    var doneCount = linkedItems.filter(function (it) {
      return getItemStatus(linkedTabDef, it) === linkedTabDef.doneKey;
    }).length;
    if (!linkedItems.length || doneCount === 0) return tabDef.states[0].key; // not-bought
    if (doneCount === linkedItems.length) return tabDef.doneKey; // bought
    return tabDef.states[1].key; // in-progress
  }

  function renderCard(tabDef, item, group) {
    if (item.linkToTab) {
      var linkedTabDef = DATA[item.linkToTab];
      var computedStatusKey = getItemStatus(tabDef, item);

      var linkCard = document.createElement("article");
      linkCard.className = "card card-link" + (tabDef.hasPhase ? " has-phase" : "");
      linkCard.setAttribute("data-state", computedStatusKey === tabDef.doneKey ? "done" : "pending");
      linkCard.setAttribute("role", "button");
      linkCard.tabIndex = 0;
      linkCard.setAttribute("aria-label", item.name + " — 前往「" + linkedTabDef.label + "」分頁");

      var linkName = document.createElement("h3");
      linkName.className = "card-name";
      linkName.textContent = item.name;
      linkCard.appendChild(linkName);

      if (tabDef.hasPhase) {
        if (tabDef.phaseSelectable) {
          var phaseSelectEl = renderPhaseSelect(item, group);
          phaseSelectEl.addEventListener("click", function (e) { e.stopPropagation(); });
          linkCard.appendChild(phaseSelectEl);
        } else {
          var phaseChip = document.createElement("span");
          phaseChip.className = "phase-chip";
          if (item.phase) {
            phaseChip.setAttribute("data-phase", item.phase);
            phaseChip.textContent = PHASE_LABEL[item.phase];
          }
          linkCard.appendChild(phaseChip);
        }
      }

      var linkNote = document.createElement("p");
      linkNote.className = "card-note";
      linkNote.textContent = item.note || "";
      if (item.note) linkNote.title = item.note;
      linkCard.appendChild(linkNote);

      // Status is not user-editable here — it mirrors the linked tab's own
      // progress (see computeLinkedTabStatusKey), so this select is disabled.
      var statusWrap = document.createElement("div");
      statusWrap.className = "status-select-wrap";
      var slotIndex = tabDef.states.findIndex(function (st) { return st.key === computedStatusKey; });
      statusWrap.dataset.slot = String(slotIndex === -1 ? 0 : slotIndex);

      var statusSelect = document.createElement("select");
      statusSelect.className = "status-select";
      statusSelect.disabled = true;
      statusSelect.setAttribute("aria-label", item.name + " 的準備狀態(自動依「" + linkedTabDef.label + "」分頁進度同步,無法手動更改)");
      tabDef.states.forEach(function (st) {
        var opt = document.createElement("option");
        opt.value = st.key;
        opt.textContent = st.label;
        if (st.key === computedStatusKey) opt.selected = true;
        statusSelect.appendChild(opt);
      });
      statusWrap.appendChild(statusSelect);

      var statusArrow = document.createElement("span");
      statusArrow.className = "select-arrow";
      statusArrow.setAttribute("aria-hidden", "true");
      statusArrow.textContent = "▾";
      statusWrap.appendChild(statusArrow);
      linkCard.appendChild(statusWrap);

      var goToLinkedTab = function () {
        activeTab = item.linkToTab;
        render();
      };
      linkCard.addEventListener("click", goToLinkedTab);
      linkCard.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goToLinkedTab();
        }
      });

      return linkCard;
    }

    var status = getItemStatus(tabDef, item);
    var isDone = status === tabDef.doneKey;

    var card = document.createElement("article");
    card.className = "card" + (tabDef.hasPhase ? " has-phase" : "") + (tabDef.hasCost ? " has-cost" : "");
    card.setAttribute("data-state", isDone ? "done" : "pending");

    var name = document.createElement("h3");
    name.className = "card-name";
    if (tabDef.hasBrandInfo) {
      var nameBtn = document.createElement("button");
      nameBtn.type = "button";
      nameBtn.className = "card-name-btn";
      nameBtn.textContent = item.name;
      nameBtn.setAttribute("aria-label", item.name + " — 查看品牌參考與備註");
      nameBtn.addEventListener("click", function () { openItemModal(item); });
      name.appendChild(nameBtn);
    } else {
      name.textContent = item.name;
    }
    card.appendChild(name);

    if (tabDef.hasPhase) {
      if (tabDef.phaseSelectable) {
        card.appendChild(renderPhaseSelect(item, group));
      } else {
        var phaseChip = document.createElement("span");
        phaseChip.className = "phase-chip";
        if (item.phase) {
          phaseChip.setAttribute("data-phase", item.phase);
          phaseChip.textContent = PHASE_LABEL[item.phase];
        }
        card.appendChild(phaseChip);
      }
    }

    var note = document.createElement("p");
    note.className = "card-note";
    note.textContent = item.note || "";
    if (item.note) note.title = item.note;
    card.appendChild(note);

    if (tabDef.hasCost) {
      var costWrap = document.createElement("div");
      costWrap.className = "cost-input-wrap";

      var costPrefix = document.createElement("span");
      costPrefix.className = "cost-prefix";
      costPrefix.setAttribute("aria-hidden", "true");
      costPrefix.textContent = "NT$";

      var costInput = document.createElement("input");
      costInput.className = "cost-input";
      costInput.type = "number";
      costInput.min = "0";
      costInput.inputMode = "numeric";
      costInput.setAttribute("aria-label", item.name + " 的花費金額");
      if (typeof item.estCost === "number") {
        costInput.placeholder = item.estCost.toLocaleString("zh-TW");
      }
      var savedCost = getItemCost(item.id);
      if (savedCost !== null) costInput.value = String(savedCost);

      costInput.addEventListener("input", function () {
        var raw = costInput.value;
        if (raw === "") {
          setItemCost(item.id, null);
        } else {
          var num = parseFloat(raw);
          setItemCost(item.id, isNaN(num) ? null : num);
        }
        refreshBudgetDisplay(tabDef);
      });

      costWrap.appendChild(costPrefix);
      costWrap.appendChild(costInput);
      card.appendChild(costWrap);
    }

    var activeSlot = tabDef.states.findIndex(function (st) { return st.key === status; });

    var wrap = document.createElement("div");
    wrap.className = "status-select-wrap";
    wrap.dataset.slot = String(activeSlot === -1 ? 0 : activeSlot);

    var select = document.createElement("select");
    select.className = "status-select";
    select.setAttribute("aria-label", item.name + " 的準備狀態");
    tabDef.states.forEach(function (st) {
      var opt = document.createElement("option");
      opt.value = st.key;
      opt.textContent = st.label;
      if (st.key === status) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener("change", function () {
      setItemStatus(item.id, select.value);
      renderTabbar();
      renderPanel();
    });

    var arrow = document.createElement("span");
    arrow.className = "select-arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "▾";

    wrap.appendChild(select);
    wrap.appendChild(arrow);
    card.appendChild(wrap);

    return card;
  }

  // ---------------- CUSTOM ITEMS (orphan preservation) ----------------
  // When a Notion sync removes a default supplies item that a visitor already
  // interacted with (checked/costed/noted/phase-overridden), it gets promoted
  // here instead of silently disappearing. See the npchecklist-notion-sync
  // skill for the sync side of this; this is the client-side half.
  var DEFAULT_SNAPSHOT_KEY = "npchecklist_default_snapshot_v1";
  var CUSTOM_ITEMS_KEY = "npchecklist_custom_items_v1";

  function loadDefaultSnapshot() {
    try {
      var raw = localStorage.getItem(DEFAULT_SNAPSHOT_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveDefaultSnapshot(items) {
    try {
      localStorage.setItem(DEFAULT_SNAPSHOT_KEY, JSON.stringify(items));
    } catch (e) { /* ignore quota errors */ }
  }

  function loadCustomItems() {
    try {
      var raw = localStorage.getItem(CUSTOM_ITEMS_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveCustomItems(items) {
    try {
      localStorage.setItem(CUSTOM_ITEMS_KEY, JSON.stringify(items));
    } catch (e) { /* ignore quota errors */ }
  }

  function hasUserData(itemId) {
    return Boolean(state[itemId] || getItemCost(itemId) !== null || notesState[itemId] || phaseState[itemId]);
  }

  function reconcileOrphanedDefaults() {
    var currentDefaults = allItems(DATA.supplies);
    var currentIds = {};
    currentDefaults.forEach(function (it) { currentIds[it.id] = true; });

    var previousSnapshot = loadDefaultSnapshot();
    if (previousSnapshot) {
      var customItems = loadCustomItems();
      var alreadyPromoted = {};
      customItems.forEach(function (it) {
        if (it.promotedFrom) alreadyPromoted[it.promotedFrom] = true;
      });

      var changed = false;
      previousSnapshot.forEach(function (prevItem) {
        if (currentIds[prevItem.id]) return; // still present, nothing to do
        if (alreadyPromoted[prevItem.id]) return; // already promoted earlier
        if (!hasUserData(prevItem.id)) return; // no user data, safe to drop

        var clone = {};
        Object.keys(prevItem).forEach(function (k) { clone[k] = prevItem[k]; });
        clone.id = "custom-" + prevItem.id;
        clone.promotedFrom = prevItem.id;
        customItems.push(clone);
        changed = true;
      });

      if (changed) saveCustomItems(customItems);
    }

    saveDefaultSnapshot(currentDefaults.map(function (it) {
      return { id: it.id, name: it.name, phase: it.phase, estCost: it.estCost, note: it.note, month: it.month };
    }));
  }

  reconcileOrphanedDefaults();

  var customItems = loadCustomItems();
  if (customItems.length) {
    DATA.supplies.groups.push({ name: "自訂項目", items: customItems });
  }

  render();
})();
</script>
